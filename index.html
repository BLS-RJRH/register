<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ลงทะเบียนอบรม First Aid & CPR 2026</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #071f54;
      --primary-light: #0d47a1;
      --primary-accent: #1976d2;
      --secondary-color: #eef5ff;
      --card-bg: rgba(255, 255, 255, 0.96);
      --border-soft: rgba(25, 118, 210, 0.16);
      --shadow-premium: 0 28px 80px rgba(7, 31, 84, 0.24);
    }

    * {
      box-sizing: border-box;
      font-family: 'Sarabun', system-ui, -apple-system, BlinkMacSystemFont, sans-serif !important;
    }

    html {
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body { 
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(25,118,210,0.22), transparent 34%),
        radial-gradient(circle at bottom right, rgba(7,31,84,0.18), transparent 38%),
        linear-gradient(135deg, #f4f8ff 0%, #eaf3ff 45%, #dbeaff 100%);
      font-family: 'Sarabun', sans-serif;
      color: #1f2937;
    }

    .page-shell {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 3vw, 40px);
    }

    .form-container { 
      width: min(100%, 760px);
      min-height: auto;
      margin: 0 auto;
      background: var(--card-bg);
      padding: clamp(24px, 4vw, 46px);
      border-radius: 28px;
      box-shadow: var(--shadow-premium);
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border-soft);
    }

    .form-container::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 9px;
      background: linear-gradient(90deg, #071f54, #0d47a1, #42a5f5);
    }

    .form-container::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -90px;
      top: -90px;
      background: radial-gradient(circle, rgba(25,118,210,0.16), transparent 68%);
      pointer-events: none;
    }

    .header { 
      text-align: center; 
      margin-bottom: clamp(22px, 3vw, 34px);
      background: linear-gradient(180deg, rgba(25,118,210,0.10), rgba(255,255,255,0));
      padding: clamp(16px, 3vw, 26px) clamp(10px, 2vw, 20px) 18px;
      border-radius: 22px;
      position: relative;
      z-index: 1;
    }

    .header img { 
      max-width: clamp(210px, 48vw, 350px); /* 🔥 ปรับขนาดโลโก้ตรงนี้ */
      width: 120%;
      height: auto; 
      margin-bottom: 10px;
      opacity: 0.98;
      filter: brightness(0.99) contrast(1.04);
    }

    .header h3 { 
      color: var(--primary-color); 
      font-weight: 800; 
      margin: 0 auto 4px;
      font-size: clamp(0.9rem, 2.35vw, 1.32rem);
      line-height: 1.45;
      padding: 4px 2px 6px;
      letter-spacing: -0.015em;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
      max-width: 100%;
    }

    .header p {
      color: #52637a;
      font-size: clamp(0.92rem, 2.8vw, 1.02rem);
      margin-bottom: 0;
      line-height: 1.55;
    }

    #successOverlay {
      display: none; 
      position: absolute; 
      inset: 0;
      background: rgba(255, 255, 255, 0.985); 
      z-index: 100; 
      border-radius: 28px; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      text-align: center; 
      padding: clamp(22px, 5vw, 36px);
    }

    .success-icon {
      font-size: clamp(64px, 16vw, 90px);
      color: #28a745;
      margin-bottom: 15px;
    }

    .form-label {
      font-weight: 700;
      color: #233044;
      margin-bottom: 8px;
      font-size: 0.98rem;
    }

    .form-control, .form-select {
      min-height: 50px;
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid #d7e2f2;
      background-color: #fbfdff;
      transition: all 0.2s ease;
      font-size: 1rem;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--primary-accent);
      background-color: #ffffff;
      box-shadow: 0 0 0 0.25rem rgba(25,118,210,0.18);
    }

    .btn-submit { 
      background: linear-gradient(135deg, #1976d2, #071f54);
      border: none; 
      padding: 15px 18px; 
      min-height: 56px;
      border-radius: 999px; 
      width: 100%; 
      color: white; 
      font-weight: 800; 
      font-size: clamp(1.02rem, 3.2vw, 1.14rem);
      transition: all 0.3s ease; 
      margin-top: 10px;
      box-shadow: 0 12px 28px rgba(13, 71, 161, 0.24);
    }

    .btn-submit:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 16px 34px rgba(13,71,161,0.36); 
      color: #fff;
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .confirm-label { 
      font-weight: 800; 
      color: #52637a; 
      width: 130px; 
      display: inline-block; 
    }

    .modal-content {
      border-radius: 22px !important;
      overflow: hidden;
    }

    .modal-header {
      background: linear-gradient(135deg, #1976d2, #071f54);
      color: white;
      border-bottom: none;
      padding: 18px 22px;
    }

    .modal-footer {
      border-top: 1px solid #e5edf8;
      border-radius: 0 0 22px 22px;
    }

    .training-choice {
      background: linear-gradient(135deg, #e3f2fd, #f3f8ff);
      color: var(--primary-color);
      border: 1px solid rgba(25,118,210,0.18);
      border-radius: 14px;
    }

    .registration-id {
      color: var(--primary-light);
    }

    @media (min-width: 992px) {
      .form-container {
        width: min(100%, 820px);
      }

      .form-grid-wide {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 16px;
      }

      .full-row {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 576px) {
      .page-shell {
        align-items: stretch;
        padding: 0;
      }

      .form-container {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        border-radius: 0;
        padding: 22px 16px 28px;
        box-shadow: none;
        border-left: none;
        border-right: none;
        border-bottom: none;
      }

      .form-container::before {
        height: 7px;
      }

      .header {
        border-radius: 18px;
        margin-bottom: 22px;
      }

      .header img {
        max-width: 235px; /* 🔥 มือถือปรับขนาดโลโก้ตรงนี้ */
      }

      .header h3 {
        font-size: clamp(0.72rem, 3.15vw, 0.94rem);
        line-height: 1.45;
        padding: 5px 0 7px;
      }

      .form-control, .form-select {
        min-height: 52px;
        font-size: 16px; /* ป้องกัน iPhone zoom ตอนแตะ input */
      }

      .confirm-label {
        width: 100%;
        display: block;
        margin-bottom: 2px;
      }

      .modal-dialog {
        margin: 12px;
      }

      #successOverlay {
        border-radius: 0;
      }
    }
  </style>
</head>
<body>

  <main class="page-shell">
    <div class="form-container">

      <div id="successOverlay">
        <div class="success-icon">✅</div>
        <h2 class="text-success fw-bold">ลงทะเบียนสำเร็จ!</h2>
        <p class="text-muted">ตรวจสอบอีเมลของท่านเพื่อรับ QR Code<br>(หากไม่พบใน Inbox โปรดเช็คใน Junk Mail)</p>
        <div class="p-4 bg-light rounded-4 w-100 mb-4 border">
          <small class="text-muted d-block mb-1">รหัสลงทะเบียน (Registration ID):</small>
          <span id="displayResId" class="registration-id fw-bold fs-2"></span>
        </div>
        <button class="btn btn-outline-secondary rounded-pill px-5" onclick="location.reload()">ลงทะเบียนคนถัดไป</button>
      </div>

      <div class="header">
        <img src="https://cppqbctiybszcneqawjw.supabase.co/storage/v1/object/public/PIC/Logo-gold.png" alt="First Aid Training Logo">
        <h2>หลักสูตรการกู้ชีพขั้นพื้นฐาน (CPR)</br> และการใช้เครื่อง AED</h2>
      </div>

      <form id="regForm" onkeydown="return event.key != 'Enter';">
        <div class="form-grid-wide">
          <div class="row full-row">
            <div class="col-md-4 mb-3">
              <label class="form-label">คำนำหน้า</label>
              <select class="form-select" name="prefix" id="inp_prefix" required>
                <option value="">เลือก...</option>
                <option value="นาย">นาย</option>
                <option value="นาง">นาง</option>
                <option value="นางสาว">นางสาว</option>
              </select>
            </div>
            <div class="col-md-8 mb-3">
              <label class="form-label">ชื่อ-นามสกุล</label>
              <input type="text" class="form-control" name="fullName" id="inp_name" required placeholder="กรอกชื่อและนามสกุล">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">เบอร์โทรศัพท์</label>
            <input type="tel" class="form-control" name="phone" id="inp_phone" required placeholder="08XXXXXXXX" pattern="[0-9]{9,10}">
          </div>

          <div class="mb-3">
            <label class="form-label">อีเมล</label>
            <input type="email" class="form-control" name="email" id="inp_email" required placeholder="example@gmail.com">
          </div>

          <div class="mb-4 full-row">
            <label class="form-label">รอบวันที่ต้องการเข้าอบรม</label>
            <select class="form-select" name="date" id="date" required>
              <option value="">เลือกวันที่และรอบเวลา</option>
              <option value="15 กรกฎาคม 2569 (รอบเช้า)">15 กรกฎาคม 2569 (09:00 - 12:00)</option>
              <option value="15 กรกฎาคม 2569 (รอบบ่าย)">15 กรกฎาคม 2569 (13:00 - 16:00)</option>
              <option value="16 กรกฎาคม 2569 (รอบเช้า)">16 กรกฎาคม 2569 (09:00 - 12:00)</option>
            </select>
          </div>
        </div>

        <button type="button" class="btn btn-submit shadow-sm" onclick="showConfirm()">ลงทะเบียนเข้าร่วมอบรม</button>
      </form>
    </div>
  </main>

  <div class="modal fade" id="confirmModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">ยืนยันข้อมูลการสมัคร</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4" id="confirmData"></div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-link text-muted text-decoration-none" data-bs-dismiss="modal">กลับไปแก้ไข</button>
          <button type="button" class="btn btn-primary px-4 rounded-pill" id="confirmBtn" onclick="submitForm()">ยืนยันข้อมูลถูกต้อง</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // URL ของ Google Apps Script (Deploy ล่าสุดของคุณ)
    const API_URL = "https://script.google.com/macros/s/AKfycbzmltnLo20zGaLgEaToN38NizWH_jqU97vT7x3nYDsqU2eZHvWBdqkxnyZ1skPyZ1XnmA/exec";

    const confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));

    // ฟังก์ชันโชว์ Modal ตรวจสอบข้อมูลก่อนส่ง
    function showConfirm() {
      const form = document.getElementById('regForm');
      if(!form.checkValidity()) { form.reportValidity(); return; }

      const prefix = document.getElementById('inp_prefix').value;
      const name = document.getElementById('inp_name').value;
      const phone = document.getElementById('inp_phone').value;
      const email = document.getElementById('inp_email').value;
      const date = document.getElementById('date').value;

      document.getElementById('confirmData').innerHTML = `
        <div class="p-1">
          <p class="mb-2"><span class="confirm-label">ชื่อ-นามสกุล:</span> <b class="text-dark">${prefix}${name}</b></p>
          <p class="mb-2"><span class="confirm-label">เบอร์โทรศัพท์:</span> <b>${phone}</b></p>
          <p class="mb-2"><span class="confirm-label">อีเมล:</span> <b>${email}</b></p>
          <hr>
          <p class="mb-1 text-muted small">รอบการอบรมที่เลือก:</p>
          <div class="p-2 training-choice text-center fw-bold">
            ${date}
          </div>
        </div>`;
      confirmModal.show();
    }

    // ฟังก์ชันส่งข้อมูลไปยัง Google Apps Script
    async function submitForm() {
      const btn = document.getElementById('confirmBtn');
      const form = document.getElementById('regForm');
      const formData = new FormData(form);

      btn.disabled = true; 
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังบันทึกข้อมูล...';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: new URLSearchParams(formData)
        });

        const res = await response.json();

        if (res.success) {
          confirmModal.hide();
          document.getElementById('displayResId').innerText = res.id;
          document.getElementById('successOverlay').style.display = 'flex';
          form.reset();
        } else {
          throw new Error(res.message || 'บันทึกไม่สำเร็จ กรุณาลองใหม่อีกครั้ง');
        }
      } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
        btn.disabled = false;
        btn.innerHTML = 'ยืนยันข้อมูลถูกต้อง';
      }
    }
  </script>
</body>
</html>
