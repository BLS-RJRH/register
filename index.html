<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียนอบรม First Aid & CPR 2026</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #d32f2f; /* สีแดงหลักสำหรับงานกู้ชีพ */
      --secondary-color: #f8f9fa;
    }

    body { 
      background-color: var(--secondary-color); 
      font-family: 'Sarabun', sans-serif; 
      padding: 40px 15px; 
    }

    .form-container { 
      max-width: 550px; 
      margin: auto; 
      background: #ffffff; 
      padding: 40px; 
      border-radius: 20px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
      position: relative; 
      border-top: 10px solid var(--primary-color);
    }

    .header { text-align: center; margin-bottom: 30px; }
    .header img { 
      max-width: 180px; /* ปรับขนาดโลโก้ใหม่ให้เหมาะสม */
      height: auto; 
      margin-bottom: 20px; 
      /* นำ border-radius ออกถ้าโลโก้มีพื้นหลังใสอยู่แล้ว */
    }
    .header h3 { color: var(--primary-color); font-weight: 700; margin-bottom: 5px; }
    .header p { color: #666; font-size: 0.95rem; }

    /* Success Overlay */
    #successOverlay {
      display: none; 
      position: absolute; 
      top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(255, 255, 255, 0.98); 
      z-index: 100; 
      border-radius: 20px; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      text-align: center; 
      padding: 30px;
    }
    .success-icon { font-size: 80px; color: #28a745; margin-bottom: 15px; }

    /* Form Styles */
    .form-label { font-weight: 600; color: #444; margin-bottom: 8px; }
    .form-control, .form-select {
      border-radius: 10px;
      padding: 12px;
      border: 1px solid #ddd;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.25rem rgba(211, 47, 47, 0.15);
    }

    .btn-submit { 
      background-color: var(--primary-color); 
      border: none; 
      padding: 15px; 
      border-radius: 50px; 
      width: 100%; 
      color: white; 
      font-weight: 700; 
      font-size: 1.1rem;
      transition: all 0.3s ease; 
      margin-top: 10px;
    }
    .btn-submit:hover { 
      background-color: #b71c1c; 
      transform: translateY(-3px); 
      box-shadow: 0 8px 20px rgba(211,47,47,0.3); 
    }

    .confirm-label { font-weight: bold; color: #777; width: 130px; display: inline-block; }
    
    @media (max-width: 576px) {
      .form-container { padding: 25px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="form-container">
      
      <div id="successOverlay">
        <div class="success-icon">✅</div>
        <h2 class="text-success fw-bold">ลงทะเบียนสำเร็จ!</h2>
        <p class="text-muted">ตรวจสอบอีเมลของท่านเพื่อรับ QR Code<br>(หากไม่พบใน Inbox โปรดเช็คใน Junk Mail)</p>
        <div class="p-4 bg-light rounded-4 w-100 mb-4 border">
          <small class="text-muted d-block mb-1">รหัสลงทะเบียน (Registration ID):</small>
          <span id="displayResId" class="text-danger fw-bold fs-2"></span>
        </div>
        <button class="btn btn-outline-secondary rounded-pill px-5" onclick="location.reload()">ลงทะเบียนคนถัดไป</button>
      </div>

      <div class="header">
        <img src="https://cppqbctiybszcneqawjw.supabase.co/storage/v1/object/public/PIC/BLS-RJR.png" alt="First Aid Training Logo">
        <h3>อบรมการปฐมพยาบาล 2026</h3>
        <p>หลักสูตรการกู้ชีพขั้นพื้นฐาน (CPR) และการใช้เครื่อง AED</p>
      </div>

      <form id="regForm" onkeydown="return event.key != 'Enter';">
        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label">คำนำหน้า</label>
            <select class="form-select" name="prefix" id="inp_prefix" required>
              <option value="">เลือก...</option>
              <option value="นาย">นาย</option>
              <option value="นาง">นาง</option>
              <option value="นางสาว">นางสาว</option>
            </select>
          </div>
          <div class="col-md-8 mb-3">
            <label class="form-label">ชื่อ-นามสกุล</label>
            <input type="text" class="form-control" name="fullName" id="inp_name" required placeholder="กรอกชื่อและนามสกุล">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">เบอร์โทรศัพท์</label>
          <input type="tel" class="form-control" name="phone" id="inp_phone" required placeholder="08XXXXXXXX" pattern="[0-9]{9,10}">
        </div>

        <div class="mb-3">
          <label class="form-label">อีเมล</label>
          <input type="email" class="form-control" name="email" id="inp_email" required placeholder="example@gmail.com">
        </div>

        <div class="mb-4">
          <label class="form-label">รอบวันที่ต้องการเข้าอบรม</label>
          <select class="form-select" name="date" id="date" required>
            <option value="">เลือกวันที่และรอบเวลา</option>
            <option value="15 กรกฎาคม 2569 (รอบเช้า)">15 กรกฎาคม 2569 (09:00 - 12:00)</option>
            <option value="15 กรกฎาคม 2569 (รอบบ่าย)">15 กรกฎาคม 2569 (13:00 - 16:00)</option>
            <option value="16 กรกฎาคม 2569 (รอบเช้า)">16 กรกฎาคม 2569 (09:00 - 12:00)</option>
          </select>
        </div>

        <button type="button" class="btn btn-submit shadow-sm" onclick="showConfirm()">ลงทะเบียนเข้าร่วมอบรม</button>
      </form>
    </div>
  </div>

  <div class="modal fade" id="confirmModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg" style="border-radius: 15px;">
        <div class="modal-header bg-danger text-white" style="border-radius: 15px 15px 0 0;">
          <h5 class="modal-title fw-bold">ยืนยันข้อมูลการสมัคร</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4" id="confirmData">
            </div>
        <div class="modal-footer bg-light" style="border-radius: 0 0 15px 15px;">
          <button type="button" class="btn btn-link text-muted text-decoration-none" data-bs-dismiss="modal">กลับไปแก้ไข</button>
          <button type="button" class="btn btn-danger px-4 rounded-pill" id="confirmBtn" onclick="submitForm()">ยืนยันข้อมูลถูกต้อง</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // URL ของ Google Apps Script (Deploy ล่าสุดของคุณ)
    const API_URL = "https://script.google.com/macros/s/AKfycbw-5hHOzrgMBBYyDC59JRbTfEZCaiBjFe-xlfecv9zVNU5ETPjzHjwHSyLQkyBS64hyVw/exec";
    
    const confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));

    // ฟังก์ชันโชว์ Modal ตรวจสอบข้อมูลก่อนส่ง
    function showConfirm() {
      const form = document.getElementById('regForm');
      if(!form.checkValidity()) { form.reportValidity(); return; }
      
      const prefix = document.getElementById('inp_prefix').value;
      const name = document.getElementById('inp_name').value;
      const phone = document.getElementById('inp_phone').value;
      const email = document.getElementById('inp_email').value;
      const date = document.getElementById('date').value;

      document.getElementById('confirmData').innerHTML = `
        <div class="p-1">
          <p class="mb-2"><span class="confirm-label">ชื่อ-นามสกุล:</span> <b class="text-dark">${prefix}${name}</b></p>
          <p class="mb-2"><span class="confirm-label">เบอร์โทรศัพท์:</span> <b>${phone}</b></p>
          <p class="mb-2"><span class="confirm-label">อีเมล:</span> <b>${email}</b></p>
          <hr>
          <p class="mb-1 text-muted small">รอบการอบรมที่เลือก:</p>
          <div class="p-2 bg-danger-subtle text-danger rounded border border-danger-subtle text-center fw-bold">
            ${date}
          </div>
        </div>`;
      confirmModal.show();
    }

    // ฟังก์ชันส่งข้อมูลไปยัง Google Apps Script
    async function submitForm() {
      const btn = document.getElementById('confirmBtn');
      const form = document.getElementById('regForm');
      const formData = new FormData(form);
      
      btn.disabled = true; 
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังบันทึกข้อมูล...';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: new URLSearchParams(formData)
        });
        
        const res = await response.json();
        
        if (res.success) {
          confirmModal.hide();
          document.getElementById('displayResId').innerText = res.id;
          document.getElementById('successOverlay').style.display = 'flex';
          form.reset();
        } else {
          throw new Error(res.message || 'บันทึกไม่สำเร็จ กรุณาลองใหม่อีกครั้ง');
        }
      } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
        btn.disabled = false;
        btn.innerHTML = 'ยืนยันข้อมูลถูกต้อง';
      }
    }
  </script>
</body>
</html>
