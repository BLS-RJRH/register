<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ลงทะเบียนอบรม First Aid & CPR 2026</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #071f54;
      --primary-light: #0d47a1;
      --primary-accent: #1976d2;
      --secondary-color: #eef5ff;
      --card-bg: rgba(255, 255, 255, 0.96);
      --border-soft: rgba(25, 118, 210, 0.16);
      --shadow-premium: 0 28px 80px rgba(7, 31, 84, 0.24);
    }

    * {
      box-sizing: border-box;
      font-family: 'Sarabun', system-ui, -apple-system, BlinkMacSystemFont, sans-serif !important;
    }

    body { 
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(25,118,210,0.22), transparent 34%),
        radial-gradient(circle at bottom right, rgba(7,31,84,0.18), transparent 38%),
        linear-gradient(135deg, #f4f8ff 0%, #eaf3ff 45%, #dbeaff 100%);
      color: #1f2937;
    }

    .page-shell {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 3vw, 40px);
    }

    .form-container { 
      width: min(100%, 760px);
      background: var(--card-bg);
      padding: clamp(24px, 4vw, 46px);
      border-radius: 28px;
      box-shadow: var(--shadow-premium);
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border-soft);
    }

    .form-container::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 9px;
      background: linear-gradient(90deg, #071f54, #0d47a1, #42a5f5);
    }

    .header { 
      text-align: center; 
      margin-bottom: clamp(22px, 3vw, 34px);
      background: linear-gradient(180deg, rgba(25,118,210,0.10), rgba(255,255,255,0));
      padding: clamp(16px, 3vw, 26px) 10px 18px;
      border-radius: 22px;
    }

    .header img { 
      max-width: clamp(210px, 48vw, 350px);
      height: auto; 
      margin-bottom: 10px;
    }

    #successOverlay {
      display: none; 
      position: absolute; 
      inset: 0;
      background: rgba(255, 255, 255, 0.985); 
      z-index: 100; 
      border-radius: 28px; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      text-align: center; 
      padding: 36px;
    }

    .form-label { font-weight: 700; color: #233044; margin-bottom: 8px; }

    .form-control, .form-select {
      min-height: 50px;
      border-radius: 14px;
      border: 1px solid #d7e2f2;
      background-color: #fbfdff;
    }

    .btn-submit { 
      background: linear-gradient(135deg, #1976d2, #071f54);
      border: none; 
      padding: 15px; 
      border-radius: 999px; 
      width: 100%; 
      color: white; 
      font-weight: 800; 
      box-shadow: 0 12px 28px rgba(13, 71, 161, 0.24);
    }

    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

    .confirm-label { font-weight: 800; color: #52637a; width: 130px; display: inline-block; }

    .training-choice {
      background: linear-gradient(135deg, #e3f2fd, #f3f8ff);
      color: var(--primary-color);
      border: 1px solid rgba(25,118,210,0.18);
      border-radius: 14px;
      padding: 12px;
    }
  </style>
</head>
<body>

  <main class="page-shell">
    <div class="form-container">

      <div id="successOverlay">
        <div class="success-icon" style="font-size: 80px;">✅</div>
        <h2 class="text-success fw-bold">ลงทะเบียนสำเร็จ!</h2>
        <p class="text-muted">ตรวจสอบอีเมลของท่านเพื่อรับ QR Code<br>(หากไม่พบโปรดเช็คใน Junk Mail)</p>
        <div class="p-4 bg-light rounded-4 w-100 mb-4 border">
          <small class="text-muted d-block mb-1">รหัสลงทะเบียน (Registration ID):</small>
          <span id="displayResId" class="text-primary fw-bold fs-2"></span>
        </div>
        <button class="btn btn-outline-secondary rounded-pill px-5" onclick="location.reload()">ลงทะเบียนคนถัดไป</button>
      </div>

      <div class="header">
        <img src="https://cppqbctiybszcneqawjw.supabase.co/storage/v1/object/public/PIC/Logo-gold.png" alt="Logo">
        <h3 class="mt-2 fw-bold text-primary">หลักสูตรการกู้ชีพขั้นพื้นฐาน (CPR) และ AED</h3>
      </div>

      <form id="regForm" onkeydown="return event.key != 'Enter';">
        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label">คำนำหน้า</label>
            <select class="form-select" name="prefix" id="inp_prefix" required>
              <option value="">เลือก...</option>
              <option value="นาย">นาย</option>
              <option value="นาง">นาง</option>
              <option value="นางสาว">นางสาว</option>
            </select>
          </div>
          <div class="col-md-8 mb-3">
            <label class="form-label">ชื่อ-นามสกุล</label>
            <input type="text" class="form-control" name="fullName" id="inp_name" required placeholder="กรอกชื่อและนามสกุล">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">เบอร์โทรศัพท์</label>
          <input type="tel" class="form-control" name="phone" id="inp_phone" required placeholder="08XXXXXXXX" pattern="[0-9]{9,10}">
        </div>

        <div class="mb-3">
          <label class="form-label">อีเมล</label>
          <input type="email" class="form-control" name="email" id="inp_email" required placeholder="example@gmail.com">
        </div>

        <div class="mb-4">
          <label class="form-label">รอบวันที่ต้องการเข้าอบรม</label>
          <select class="form-select" name="date" id="date" required>
            <option value="">กำลังโหลดรอบการอบรม...</option>
          </select>
        </div>

        <button type="button" id="mainSubmitBtn" class="btn btn-submit shadow-sm" onclick="showConfirm()">ลงทะเบียนเข้าร่วมอบรม</button>
      </form>
    </div>
  </main>

  <!-- Modal ยืนยัน -->
  <div class="modal fade" id="confirmModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold">ยืนยันข้อมูลการสมัคร</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4" id="confirmData"></div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-link text-muted text-decoration-none" data-bs-dismiss="modal">กลับไปแก้ไข</button>
          <button type="button" class="btn btn-primary px-4 rounded-pill" id="confirmBtn" onclick="submitForm()">ยืนยันข้อมูลถูกต้อง</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // URL ของ Google Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbzmltnLo20zGaLgEaToN38NizWH_jqU97vT7x3nYDsqU2eZHvWBdqkxnyZ1skPyZ1XnmA/exec";
    const confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));

    // 1. โหลดข้อมูลรอบการอบรมทันทีที่เปิดหน้าเว็บ
    window.addEventListener('DOMContentLoaded', loadSessions);

    async function loadSessions() {
      const dateSelect = document.getElementById('date');
      try {
        const response = await fetch(`${API_URL}?action=getSessions`);
        const sessions = await response.json();

        dateSelect.innerHTML = '<option value="">เลือกวันที่และรอบเวลา</option>';
        
        sessions.forEach(session => {
          const option = document.createElement('option');
          option.value = session.name;
          
          let statusText = `(ว่าง ${session.available}/${session.max})`;
          if (session.isFull) {
            option.disabled = true;
            statusText = `(เต็มแล้ว)`;
          }
          
          option.textContent = `${session.name} ${statusText}`;
          dateSelect.appendChild(option);
        });
      } catch (error) {
        dateSelect.innerHTML = '<option value="">เกิดข้อผิดพลาดในการโหลดข้อมูล</option>';
        console.error("Load sessions error:", error);
      }
    }

    function showConfirm() {
      const form = document.getElementById('regForm');
      if(!form.checkValidity()) { form.reportValidity(); return; }

      const prefix = document.getElementById('inp_prefix').value;
      const name = document.getElementById('inp_name').value;
      const phone = document.getElementById('inp_phone').value;
      const email = document.getElementById('inp_email').value;
      const date = document.getElementById('date').value;

      document.getElementById('confirmData').innerHTML = `
        <div>
          <p class="mb-2"><span class="confirm-label">ชื่อ-นามสกุล:</span> <b>${prefix}${name}</b></p>
          <p class="mb-2"><span class="confirm-label">เบอร์โทรศัพท์:</span> <b>${phone}</b></p>
          <p class="mb-2"><span class="confirm-label">อีเมล:</span> <b>${email}</b></p>
          <hr>
          <p class="mb-1 text-muted small">รอบที่เลือก:</p>
          <div class="training-choice text-center fw-bold">${date}</div>
        </div>`;
      confirmModal.show();
    }

    async function submitForm() {
      const btn = document.getElementById('confirmBtn');
      const form = document.getElementById('regForm');
      const formData = new FormData(form);

      btn.disabled = true; 
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังบันทึก...';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: new URLSearchParams(formData)
        });

        const res = await response.json();

        if (res.success) {
          confirmModal.hide();
          document.getElementById('displayResId').innerText = res.id;
          document.getElementById('successOverlay').style.display = 'flex';
          form.reset();
        } else {
          throw new Error(res.message);
        }
      } catch (err) {
        alert("ข้อผิดพลาด: " + err.message);
        btn.disabled = false;
        btn.innerHTML = 'ยืนยันข้อมูลถูกต้อง';
      }
    }
  </script>
</body>
</html>
